<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>缓存管理 - 发面馒头</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="/">
      <svg class="brand-logo" viewBox="0 0 32 32" width="25" height="25" aria-hidden="true">
        <path d="M16 3C9.9 3 5.5 8.1 5.5 13.8c0 4.3 3.5 8 3.5 8h14s3.5-3.7 3.5-8C26.5 8.1 22.1 3 16 3z" fill="#3370ff"/>
        <path d="M13.2 9.6c1.6-1.4 4-1.4 5.6 0" stroke="#ffffff" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      </svg>
      <span>发面馒头</span>
    </a>
    <button class="hamburger" id="hamburger" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="/">问答</a>
      <a href="/cache-manage" class="active">缓存管理</a>
      <a href="/setting">设置</a>
      <span class="nav-user" id="userName"></span>
      <button class="nav-logout" id="logoutBtn" type="button">退出</button>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <h1 style="margin:0;">🗂️ 问答缓存</h1>
        <button class="btn secondary" id="exportBtn">⬇ 导出 Markdown</button>
      </div>
      <p class="muted" style="margin-top:8px;">共 <span id="count">0</span> 条记录 · 可编辑、删除错误回答</p>
    </div>

    <div id="list"></div>
    <div class="empty-tip" id="empty" style="display:none;">暂无缓存记录</div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let toastTimer = null;
    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
    }
    $("hamburger").addEventListener("click", () => $("navLinks").classList.toggle("open"));

    // 当前用户 + 退出登录
    async function loadMe() {
      try {
        const res = await fetch("/api/me");
        if (res.status === 401) { location.href = "/login"; return; }
        const d = await res.json();
        $("userName").textContent = d.username;
      } catch (e) {}
    }
    $("logoutBtn").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      location.href = "/login";
    });
    loadMe();

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function loadCache() {
      const res = await fetch("/api/cache");
      const data = await res.json();
      $("count").textContent = data.items.length;
      $("empty").style.display = data.items.length ? "none" : "block";
      $("list").innerHTML = data.items.map(it => `
        <div class="cache-item" id="item-${it.id}">
          <div class="q">❓ ${escapeHtml(it.user_query)}</div>
          <div class="a" id="answer-${it.id}">${escapeHtml(it.ai_answer)}</div>
          <div class="meta">
            <span>🕐 ${it.create_at}${it.collection_name ? " · 📁 " + escapeHtml(it.collection_name) : ""}</span>
            <div class="actions">
              <button class="btn secondary small" onclick="edit(${it.id})">编辑</button>
              <button class="btn danger small" onclick="del(${it.id})">删除</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    function edit(id) {
      const ansDiv = $("answer-" + id);
      const text = ansDiv.textContent;
      ansDiv.innerHTML = `<textarea id="edit-${id}">${escapeHtml(text)}</textarea>
        <div class="actions" style="display:flex;gap:6px;margin-top:6px;">
          <button class="btn small" onclick="save(${id})">保存</button>
          <button class="btn secondary small" onclick="loadCache()">取消</button>
        </div>`;
      $("edit-" + id).focus();
    }

    async function save(id) {
      const val = $("edit-" + id).value.trim();
      const res = await fetch(`/api/cache/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ai_answer: val }),
      });
      if (res.ok) { toast("已保存"); loadCache(); }
      else toast("保存失败");
    }

    async function del(id) {
      if (!confirm("确定删除这条缓存记录吗？")) return;
      const res = await fetch(`/api/cache/${id}`, { method: "DELETE" });
      if (res.ok) { toast("已删除"); loadCache(); }
      else toast("删除失败");
    }

    $("exportBtn").addEventListener("click", async () => {
      const res = await fetch("/api/cache/export");
      const data = await res.json();
      const blob = new Blob([data.content], { type: "text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "面试问答缓存.md";
      a.click();
      URL.revokeObjectURL(a.href);
      toast(`已导出 ${data.count} 条`);
    });

    loadCache();
  </script>
</body>
</html>
