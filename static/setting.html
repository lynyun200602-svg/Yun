<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>设置 - 发面馒头</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="/">
      <svg class="brand-logo" viewBox="0 0 32 32" width="25" height="25" aria-hidden="true">
        <path d="M16 3C9.9 3 5.5 8.1 5.5 13.8c0 4.3 3.5 8 3.5 8h14s3.5-3.7 3.5-8C26.5 8.1 22.1 3 16 3z" fill="#3370ff"/>
        <path d="M13.2 9.6c1.6-1.4 4-1.4 5.6 0" stroke="#ffffff" stroke-width="1.7" fill="none" stroke-linecap="round"/>
      </svg>
      <span>发面馒头</span>
    </a>
    <button class="hamburger" id="hamburger" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="/">问答</a>
      <a href="/cache-manage">缓存管理</a>
      <a href="/setting" class="active">设置</a>
      <span class="nav-user" id="userName"></span>
      <button class="nav-logout" id="logoutBtn" type="button">退出</button>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h1>⚙️ 设置</h1>

      <div class="field">
        <label>API Key（填哪家就自动对接哪家）</label>
        <input type="password" id="apiKey" placeholder="sk-... / sk-ant-..." autocomplete="off">
        <p class="hint" id="keyStatus">加载中…</p>
      </div>

      <div class="field">
        <label>模型（可直接输入，也可点右侧下拉选预设）</label>
        <input type="text" id="model" list="modelPresets" placeholder="deepseek-v4-pro">
        <datalist id="modelPresets">
          <option value="deepseek-v4-pro"></option>
          <option value="deepseek-chat"></option>
          <option value="deepseek-reasoner"></option>
          <option value="claude-opus-5"></option>
          <option value="claude-sonnet-5"></option>
          <option value="claude-haiku-4-5-20251001"></option>
          <option value="gpt-4o"></option>
          <option value="gpt-4o-mini"></option>
        </datalist>
        <p class="hint" id="modelStatus">保存后每次打开自动沿用此模型，可随时修改</p>
      </div>

      <button class="btn" id="saveBtn">保存设置</button>
    </div>

    <div class="card">
      <h2>🗑️ 危险操作</h2>
      <p class="muted" style="margin-bottom:12px;">清空已上传的简历资料文件（不影响问答缓存记录）</p>
      <button class="btn danger" id="clearBtn">清空知识库</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let toastTimer = null;
    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
    }
    $("hamburger").addEventListener("click", () => $("navLinks").classList.toggle("open"));

    // 当前用户 + 退出登录
    async function loadMe() {
      try {
        const res = await fetch("/api/me");
        if (res.status === 401) { location.href = "/login"; return; }
        const d = await res.json();
        $("userName").textContent = d.username;
      } catch (e) {}
    }
    $("logoutBtn").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      location.href = "/login";
    });
    loadMe();

    async function loadSetting() {
      const res = await fetch("/api/setting");
      const data = await res.json();
      $("model").value = data.model;
      $("keyStatus").textContent = data.has_key
        ? `已配置（${data.key_masked}），留空则不改 key`
        : "尚未配置，请粘贴你的 API Key";
      $("modelStatus").textContent = `当前自动识别服务商：${data.provider} · 保存后每次打开自动沿用此模型`;
    }

    $("saveBtn").addEventListener("click", async () => {
      const res = await fetch("/api/setting", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ api_key: $("apiKey").value, model: $("model").value }),
      });
      if (res.ok) { toast("已保存"); $("apiKey").value = ""; loadSetting(); }
      else toast("保存失败");
    });

    $("clearBtn").addEventListener("click", async () => {
      if (!confirm("确定清空所有已上传的简历资料文件吗？此操作不可恢复。")) return;
      const res = await fetch("/api/files", { method: "DELETE" });
      const data = await res.json();
      toast(`已清空 ${data.removed} 个文件`);
    });

    loadSetting();
  </script>
</body>
</html>
